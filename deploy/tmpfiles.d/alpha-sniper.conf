# Reading-B persistence for the news daemon log directory (mission
# feature f-m4-03; fulfills VAL-M4-016).
#
# Install on the VPS as ``/etc/tmpfiles.d/alpha-sniper.conf`` and
# materialise via:
#
#   systemd-tmpfiles --create /etc/tmpfiles.d/alpha-sniper.conf
#
# systemd evaluates this file on boot via systemd-tmpfiles-setup.service
# so /var/log/alpha_sniper survives a reboot even if the directory
# was on tmpfs (it is not on grokhyper, but the persistence
# declaration is part of the M4 contract).
#
# Type d = create directory if missing, idempotent on re-creation.
# Mode 0755 root root matches VAL-M4-016 evidence.
d /var/log/alpha_sniper 0755 root root - -
