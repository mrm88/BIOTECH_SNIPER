[pytest]
# Project-default pytest configuration.
#
# ── xdist distribution mode ────────────────────────────────────────────────
# Set the default distribution algorithm to ``loadfile`` so all tests in
# the same file run on the same xdist worker. Without this, the default
# ``load`` algorithm scatters tests across workers test-by-test, which
# breaks two cases in ``tests/test_unified_scorer_cli.py`` whose env
# mutations (``monkeypatch.delenv("GEMINI_API_KEY")``) are sensitive to
# inter-test ordering inside the same worker. The fix per f-misc-04 is
# to pin the unit of distribution to file granularity so the
# unified-scorer-CLI cases always run sequentially together.
#
# This also fixes a subtler race: tests that mutate the project's
# SQLite db file (``data/alpha_sniper.db``) via redirect fixtures
# benefit from being grouped per file, since one file's setup vs
# another file's setup can otherwise interleave on the same worker.
#
# Workers can still opt back into the per-test ``load`` algorithm by
# passing ``--dist=load`` on the command line.
addopts = --dist=loadfile

# Discoverable test paths.
testpaths = tests
